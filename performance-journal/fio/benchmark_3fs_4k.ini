[benchfio]
target = /3fs/stage/fuse/3fs_benchmark
output = benchmarks_iouring
; mode = read,write
mode = randread,randwrite,read,write
# ; mode = randread,randwrite,read,write,rw,randrw
size = 100GB
; block_size = 1M
block_size = 4k
iodepth = 1,2,4,8,16,32,64,128
numjobs = 1,2,4,8
direct = 1
type = directory
; precondition = True
;precondition_repeat = True
runtime = 600
destructive = True
engine = external:/3fs/benchmarks/fio_usrbio/hf3fs_usrbio.so
extra_opts = mountpoint=/3fs/stage/
loops = 1
;loginterval = 1000
;invalidate = 1
; rwmixread = 50,95
time_based = True
entire_device = False
quiet = False
dry_run = False
create = True
parallel = True
;ss = False
;extra_opts = 
