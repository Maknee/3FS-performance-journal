[benchfio]
target = /ssd/
output = benchmarks_iouring
; mode = read,write
mode = randread,randwrite,read,write
# ; mode = randread,randwrite,read,write,rw,randrw
size = 10G
;block_size = 1M
block_size = 4k
iodepth = 1,2,4,8,16,32,64,128
numjobs = 1,2,4,8,16
direct = 1
type = directory
; precondition = True
;precondition_repeat = True
runtime = 600
destructive = True
engine = io_uring
loops = 1
;loginterval = 1000
;invalidate = 1
; rwmixread = 50,95
time_based = False
entire_device = False
quiet = False
dry_run = False
create = True
parallel = True
;ss = False
;extra_opts = 

